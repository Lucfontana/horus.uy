<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        if (localStorage.getItem('horus-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu compra - Horus Uruguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/checkout.css">
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <a href="/frontend/index.html" class="brand" aria-label="Horus Uruguay - Inicio">
        <img src="src/logo.png" alt="Logo Horus Uruguay" id="logo">
      </a>

      <div class="site-header__actions">
        <button type="button" class="icon-btn" id="profile-btn" aria-label="Mi cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-pressed="false" aria-label="Cambiar a modo claro">
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4.5"></line>
            <line x1="12" y1="19.5" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="4.5" y2="12"></line>
            <line x1="19.5" y1="12" x2="22" y2="12"></line>
            <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"></line>
            <line x1="17.4" y1="17.4" x2="19.1" y2="19.1"></line>
            <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"></line>
            <line x1="17.4" y1="6.6" x2="19.1" y2="4.9"></line>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="checkout-main">
    <div class="checkout-heading">
      <p class="eyebrow">Horus Uruguay</p>
      <h1>Tu compra</h1>
    </div>

    <div class="checkout-layout">
      <section class="checkout-products" aria-label="Productos en tu carrito">
        <div class="checkout-products__labels" aria-hidden="true">
          <span>Producto</span>
          <span>Cantidad</span>
          <span>Precio</span>
          <span></span>
        </div>
        <div class="checkout-items" id="checkout-items" aria-live="polite">
          <p class="checkout-status" role="status">Cargando tu compra...</p>
        </div>
      </section>

      <aside class="checkout-summary" aria-labelledby="summary-title">
        <h2 id="summary-title">Resumen de compra</h2>
        <div class="checkout-discount">
          <label class="visually-hidden" for="discount-code">Código de descuento</label>
          <input id="discount-code" type="text" placeholder="Ingresar cupón de descuento" autocomplete="off">
          <button type="button" class="checkout-button checkout-button--apply">Aplicar</button>
        </div>

        <dl class="checkout-totals">
          <div>
            <dt>Subtotal</dt>
            <dd id="checkout-subtotal">$ 0,00</dd>
          </div>
          <div class="checkout-totals__total">
            <dt>Total</dt>
            <dd id="checkout-total">$ 0,00</dd>
          </div>
        </dl>

        <button type="button" class="checkout-button checkout-button--finish">Finalizar compra</button>
        <a class="checkout-continue" href="/frontend/catalogo.html">Seguir comprando</a>
      </aside>
    </div>
  </main>

  <script src="../backend/theme.js"></script>
  <script type="module" src="../backend/checkout.js"></script>
</body>
</html>
